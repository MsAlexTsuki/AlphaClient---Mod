name: Recording Studio Windows WASAPI

on:
  push:
    branches:
      - RecordingStudio-Sister-mod
    paths:
      - "native/wasapi/**"
      - "src/main/java/com/alpharip/staffmod/RecordingStudio/audio/**"
      - "src/main/java/com/alpharip/staffmod/RecordingStudio/core/RecordingStudioController.java"
      - "src/main/java/com/alpharip/staffmod/RecordingStudio/ui/RecordingStudioScreen.java"
      - "build.gradle"
      - ".github/workflows/recording-studio-wasapi.yml"
  pull_request:
    paths:
      - "native/wasapi/**"
      - "src/main/java/com/alpharip/staffmod/RecordingStudio/audio/**"
      - "src/main/java/com/alpharip/staffmod/RecordingStudio/core/RecordingStudioController.java"
      - "build.gradle"

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"

      - name: Configure native WASAPI bridge
        run: cmake -S native/wasapi -B build/wasapi -G "Visual Studio 18 2026" -A x64

      - name: Compile native WASAPI bridge
        run: cmake --build build/wasapi --config Release

      - name: Verify native DLL
        shell: pwsh
        run: |
          $dll = "build/wasapi/bin/Release/alpha_wasapi.dll"
          if (!(Test-Path $dll)) { throw "WASAPI DLL was not produced: $dll" }

      - name: Package native DLL through Gradle resources
        env:
          ALPHA_WASAPI_CMAKE_GENERATOR: Visual Studio 18 2026
        run: .\gradlew.bat processResources --no-daemon

      - name: Verify packaged resource
        shell: pwsh
        run: |
          $dll = "build/resources/main/native/windows-x86_64/alpha_wasapi.dll"
          if (!(Test-Path $dll)) { throw "WASAPI DLL was not packaged: $dll" }

      - name: Compile Java 8 WASAPI bridge classes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/wasapi-java | Out-Null
          javac -source 1.8 -target 1.8 -d build/wasapi-java src/main/java/com/alpharip/staffmod/RecordingStudio/audio/RecordingAudioCaptureService.java src/main/java/com/alpharip/staffmod/RecordingStudio/audio/WasapiNativeBridge.java src/main/java/com/alpharip/staffmod/RecordingStudio/audio/WasapiLoopbackCaptureService.java src/main/java/com/alpharip/staffmod/RecordingStudio/audio/GameAudioCaptureService.java

      - name: Upload native bridge build
        uses: actions/upload-artifact@v4
        with:
          name: alpha-recording-studio-wasapi-windows-x64
          path: build/wasapi/bin/Release/alpha_wasapi.dll
          if-no-files-found: error
