name: Publish Alpha Store Preview

on:
  push:
    branches:
      - mod-ideas
    paths:
      - "src/main/java/com/alpharip/staffmod/store/alphalauncher store/**"
      - ".github/workflows/alpha-store-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alpha-store-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Store website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "src/main/java/com/alpharip/staffmod/store/alphalauncher store"

      - name: Deploy Store website
        id: deployment
        uses: actions/deploy-pages@v4
