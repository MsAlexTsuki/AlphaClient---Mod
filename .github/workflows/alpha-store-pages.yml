name: Publish Alpha Store and Policy Previews

on:
  push:
    branches:
      - mod-ideas
    paths:
      - "src/main/java/com/alpharip/staffmod/store/alphalauncher store/**"
      - "Alpha Policy and Juristiction/Policies/**"
      - "Alpha Policy and Juristiction/Website/**"
      - ".github/workflows/alpha-store-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alpha-pages-previews
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble preview websites
        run: |
          mkdir -p _site/policy _site/Policies
          cp -a "src/main/java/com/alpharip/staffmod/store/alphalauncher store/." _site/
          cp -a "Alpha Policy and Juristiction/Website/." _site/policy/
          cp -a "Alpha Policy and Juristiction/Policies/." _site/Policies/

      - name: Upload Store and Policy websites
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy preview websites
        id: deployment
        uses: actions/deploy-pages@v4
